<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Unfucker — Messy data, instantly clean</title>
  <meta name="description" content="Data Unfucker turns messy PDF and raw text into clean Excel/CSV tables using AI. Paste, drop, unfuck, export." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Force Babel's React preset to the classic runtime (React.createElement),
       so the in-browser transform never emits ESM `import` statements. -->
  <script>
    if (window.Babel) {
      Babel.registerPreset('react-classic', {
        presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
      });
    }
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            ink: {
              950: '#08090b',
              900: '#0c0e11',
              850: '#111418',
              800: '#171b20',
              750: '#1d2228',
              700: '#252b32',
              600: '#343b44',
            },
            em: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            },
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(16,185,129,0.25), 0 8px 40px -8px rgba(16,185,129,0.35)',
          },
        },
      },
    };
  </script>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { background: #08090b; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0c0e11; }

    ::-webkit-scrollbar-thumb:hover { background: #343b44; }

      background:
        radial-gradient(60% 50% at 80% 0%, rgba(16,185,129,0.10) 0%, transparent 60%),
        radial-gradient(50% 40% at 0% 10%, rgba(16,185,129,0.06) 0%, transparent 55%),
        #08090b;
    }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
    .rise { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes fadein { from { opacity:0 } to { opacity:1 } }
    .fadein { animation: fadein .35s ease both; }
    [contenteditable]:focus { outline: none; }
    .grid-cell:focus-within { box-shadow: inset 0 0 0 1.5px #10b981; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    /* ---------- Icon helper (renders raw Lucide SVG) ---------- */
    function Icon({ name, className = "", size = 18, strokeWidth = 2 }) {
      const svg = useMemo(() => {
        try {
          const key = name.split('-').map(p => p[0].toUpperCase() + p.slice(1)).join('');
          const icon = window.lucide && window.lucide.icons && window.lucide.icons[key];
          if (!Array.isArray(icon)) return '';
          // Lucide UMD: icon is the array of [tag, attrs] child pairs.
          const inner = icon.map(([tag, a]) =>
            `<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ')} />`
          ).join('');
          return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
        } catch (e) { return ''; }
      }, [name, size, strokeWidth]);
      return <span className={"inline-flex items-center justify-center " + className}
        dangerouslySetInnerHTML={{ __html: svg }} />;
    }

    /* ---------- Constants ---------- */
    const STORAGE_KEY = 'data-unfucker:apikey';
    const CLAUDE_MODEL = 'claude-opus-4-8';
    const OPENAI_MODEL = 'gpt-4o';

    const SYSTEM_PROMPT =
      "You are a data extraction engine. The user provides messy, unstructured, or semi-structured raw text " +
      "(often pasted from PDFs, emails, invoices, receipts, logs, or copied tables). " +
      "Your job: infer the most natural tabular structure and return ONLY a strict, valid JSON array of objects. " +
      "Rules: " +
      "1) Output JSON ONLY — no markdown fences, no prose, no explanation. " +
      "2) Each element is an object representing one row/record. " +
      "3) Object keys are the column headers, chosen dynamically from the data's actual context " +
      "(e.g. 'Date', 'Description', 'Amount', 'Quantity', 'Name', 'Email'). Use clean, Title Case headers. " +
      "4) Every object MUST share the same set of keys. Use empty string \"\" for missing values. " +
      "5) Keep values as plain strings unless clearly numeric. Do not invent data. " +
      "If absolutely no structure can be found, return [].";

    /* ---------- Demo-mode smart parser ---------- */
    function detectDelimiter(lines) {
      const candidates = ['\t', ',', ';', '|'];
      let best = null, bestScore = 0;
      for (const d of candidates) {
        const counts = lines.slice(0, 12).map(l => (l.split(d).length - 1));
        const nonZero = counts.filter(c => c > 0);
        if (nonZero.length < Math.max(2, lines.length * 0.4)) continue;
        const avg = nonZero.reduce((a, b) => a + b, 0) / nonZero.length;
        const consistent = nonZero.filter(c => c === Math.round(avg)).length / nonZero.length;
        const score = avg * consistent;
        if (score > bestScore) { bestScore = score; best = d; }
      }
      return best;
    }

    function splitDelimited(line, d) {
      if (d !== ',') return line.split(d).map(s => s.trim());
      const out = []; let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQ && line[i + 1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
        else cur += c;
      }
      out.push(cur.trim());
      return out;
    }

    function looksLikeHeader(cells) {
      const numeric = cells.filter(c => /^-?[\d.,$%\s]+$/.test(c) && /\d/.test(c)).length;
      return numeric <= cells.length / 3;
    }

    function smartParse(raw) {
      const text = (raw || '').replace(/\r\n/g, '\n').trim();
      if (!text) return [];
      const lines = text.split('\n').map(l => l.trimEnd()).filter(l => l.trim().length);
      if (!lines.length) return [];

      // 1) Delimited table
      const d = detectDelimiter(lines);
      if (d) {
        let rows = lines.map(l => splitDelimited(l, d));
        const width = Math.max(...rows.map(r => r.length));
        rows = rows.map(r => { while (r.length < width) r.push(''); return r; });
        let headers, dataRows;
        if (looksLikeHeader(rows[0])) {
          headers = rows[0].map((h, i) => h || `Column ${i + 1}`);
          dataRows = rows.slice(1);
        } else {
          headers = rows[0].map((_, i) => `Column ${i + 1}`);
          dataRows = rows;
        }
        const seen = {};
        headers = headers.map(h => { if (seen[h] != null) { seen[h]++; return `${h} ${seen[h]}`; } seen[h] = 1; return h; });
        return dataRows.map(r => Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ''])));
      }

      // 2) Key: value records separated by blank lines
      const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      const kvBlocks = blocks.map(b => {
        const o = {};
        b.split('\n').forEach(line => {
          const m = line.match(/^\s*([A-Za-z][\w .\/#-]{0,40}?)\s*[:\-]\s+(.*)$/);
          if (m) o[m[1].trim()] = m[2].trim();
        });
        return o;
      }).filter(o => Object.keys(o).length >= 2);
      if (kvBlocks.length) {
        const allKeys = [];
        kvBlocks.forEach(o => Object.keys(o).forEach(k => { if (!allKeys.includes(k)) allKeys.push(k); }));
        return kvBlocks.map(o => Object.fromEntries(allKeys.map(k => [k, o[k] ?? ''])));
      }

      // 3) Whitespace-aligned columns (2+ spaces)
      const multiCol = lines.map(l => l.split(/\s{2,}/).map(s => s.trim()).filter(Boolean));
      const widthCounts = {};
      multiCol.forEach(r => { widthCounts[r.length] = (widthCounts[r.length] || 0) + 1; });
      const common = Number(Object.keys(widthCounts).sort((a, b) => widthCounts[b] - widthCounts[a])[0]);
      if (common >= 2 && multiCol.filter(r => r.length === common).length >= lines.length * 0.6) {
        const rows = multiCol.filter(r => r.length === common);
        let headers, dataRows;
        if (looksLikeHeader(rows[0])) { headers = rows[0]; dataRows = rows.slice(1); }
        else { headers = rows[0].map((_, i) => `Column ${i + 1}`); dataRows = rows; }
        return dataRows.map(r => Object.fromEntries(headers.map((h, i) => [h, r[i] ?? ''])));
      }

      // 4) Fallback — one row per non-empty line
      return lines.map((l, i) => ({ '#': String(i + 1), Value: l.trim() }));
    }

    /* ---------- JSON extraction from model output ---------- */
    function extractJsonArray(content) {
      if (!content) throw new Error('Empty response from AI.');
      let s = content.trim();
      const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) s = fence[1].trim();
      const start = s.indexOf('[');
      const end = s.lastIndexOf(']');
      if (start !== -1 && end !== -1 && end > start) s = s.slice(start, end + 1);
      const parsed = JSON.parse(s);
      if (!Array.isArray(parsed)) throw new Error('AI did not return a JSON array.');
      return parsed.map(row => {
        const o = {};
        Object.entries(row || {}).forEach(([k, v]) => {
          o[String(k)] = (v === null || v === undefined) ? '' :
            (typeof v === 'object' ? JSON.stringify(v) : String(v));
        });
        return o;
      });
    }

    function normalizeColumns(rows) {
      const cols = [];
      rows.forEach(r => Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
      return rows.map(r => Object.fromEntries(cols.map(c => [c, r[c] ?? ''])));
    }

    /* ---------- API calls ---------- */
    async function callClaude(apiKey, rawText) {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: CLAUDE_MODEL,
          max_tokens: 8000,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: 'Convert this into a clean table as a JSON array of objects:\n\n' + rawText }],
        }),
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`Claude API ${res.status}: ${t.slice(0, 200)}`);
      }
      const data = await res.json();
      const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      return extractJsonArray(text);
    }

    async function callOpenAI(apiKey, rawText) {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + apiKey },
        body: JSON.stringify({
          model: OPENAI_MODEL,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT + ' Return an object {"rows": [...]} where rows is the array.' },
            { role: 'user', content: 'Convert this into a clean table:\n\n' + rawText },
          ],
          response_format: { type: 'json_object' },
        }),
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`OpenAI API ${res.status}: ${t.slice(0, 200)}`);
      }
      const data = await res.json();
      const content = data.choices?.[0]?.message?.content || '';
      const obj = JSON.parse(content);
      const arr = Array.isArray(obj) ? obj : (obj.rows || obj.data || obj.table || Object.values(obj).find(Array.isArray) || []);
      return extractJsonArray(JSON.stringify(arr));
    }

    function providerOf(key) {
      if (!key) return null;
      return key.trim().startsWith('sk-ant-') ? 'claude' : 'openai';
    }

    /* ---------- CSV export ---------- */
    function toCsv(rows, columns) {
      const esc = (v) => {
        const s = (v ?? '').toString();
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const head = columns.map(esc).join(',');
      const body = rows.map(r => columns.map(c => esc(r[c])).join(',')).join('\n');
      return head + '\n' + body;
    }

    function downloadCsv(rows, columns) {
      const csv = toCsv(rows, columns);
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `unfucked-data-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ===================================================================== */
    /*  COMPONENTS                                                            */
    /* ===================================================================== */

    function ApiKeyButton({ apiKey, onSave }) {
      const [open, setOpen] = useState(false);
      const [draft, setDraft] = useState(apiKey || '');
      const [show, setShow] = useState(false);
      const provider = providerOf(apiKey);
      useEffect(() => { setDraft(apiKey || ''); }, [apiKey]);

      return (
        <div className="relative">
          <button onClick={() => setOpen(o => !o)}
            className="group flex items-center gap-2 rounded-xl border border-ink-700 bg-ink-850 px-3.5 py-2 text-sm font-medium text-zinc-300 transition hover:border-ink-600 hover:bg-ink-800">
            <Icon name="key-round" size={16} className={apiKey ? 'text-em-400' : 'text-zinc-500'} />
            <span className="hidden sm:inline">{apiKey ? (provider === 'claude' ? 'Claude key' : 'OpenAI key') : 'API key'}</span>
            <span className={"h-1.5 w-1.5 rounded-full " + (apiKey ? 'bg-em-400' : 'bg-zinc-600')} />
          </button>

          {open && (
            <>
              <div className="fixed inset-0 z-30" onClick={() => setOpen(false)} />
              <div className="fadein absolute right-0 z-40 mt-2 w-[340px] rounded-2xl border border-ink-700 bg-ink-850 p-4 shadow-2xl shadow-black/60">
                <div className="mb-1 flex items-center gap-2">
                  <Icon name="shield-check" size={16} className="text-em-400" />
                  <h3 className="text-sm font-semibold text-white">API Configuration</h3>
                </div>
                <p className="mb-3 text-xs leading-relaxed text-zinc-500">
                  Paste your Claude or OpenAI key. Stored only in your browser's localStorage — never sent anywhere but the provider.
                </p>
                <div className="relative">
                  <input
                    type={show ? 'text' : 'password'}
                    value={draft}
                    onChange={e => setDraft(e.target.value)}
                    placeholder="sk-ant-... or sk-..."
                    className="w-full rounded-lg border border-ink-700 bg-ink-900 px-3 py-2.5 pr-9 text-sm text-zinc-200 placeholder-zinc-600 focus:border-em-600 focus:ring-1 focus:ring-em-600"
                  />
                  <button onClick={() => setShow(s => !s)}
                    className="absolute right-2 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300">
                    <Icon name={show ? 'eye-off' : 'eye'} size={16} />
                  </button>
                </div>
                {draft && (
                  <p className="mt-2 text-xs text-zinc-500">
                    Detected: <span className="font-medium text-em-400">{providerOf(draft) === 'claude' ? 'Anthropic Claude' : 'OpenAI'}</span>
                  </p>
                )}
                <div className="mt-3 flex gap-2">
                  <button onClick={() => { onSave(draft.trim()); setOpen(false); }}
                    className="flex-1 rounded-lg bg-em-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-em-500">
                    Save key
                  </button>
                  {apiKey && (
                    <button onClick={() => { onSave(''); setDraft(''); }}
                      className="rounded-lg border border-ink-700 px-3 py-2 text-sm text-zinc-400 transition hover:border-rose-700 hover:text-rose-400">
                      Clear
                    </button>
                  )}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    const LOADING_STAGES = [
      { icon: 'file-text', text: 'Reading file…' },
      { icon: 'brain-circuit', text: 'AI analyzing structure…' },
      { icon: 'table-2', text: 'Generating clean table…' },
    ];

    function LoadingState({ demo }) {
      const [stage, setStage] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setStage(s => (s + 1) % LOADING_STAGES.length), 900);
        return () => clearInterval(t);
      }, []);
      const cur = LOADING_STAGES[stage];
      return (
        <div className="flex flex-col items-center justify-center gap-5 py-16">
          <div className="relative">
            <div className="h-16 w-16 animate-spin rounded-full border-2 border-ink-700 border-t-em-500" style={{ animationDuration: '0.9s' }} />
            <div className="absolute inset-0 flex items-center justify-center text-em-400">
              <Icon name={cur.icon} size={22} />
            </div>
          </div>
          <div className="h-6 overflow-hidden">
            <p key={stage} className="rise text-sm font-medium text-zinc-300">{cur.text}</p>
          </div>
          {demo && <p className="text-xs text-zinc-600">Demo Mode — parsing locally</p>}
        </div>
      );
    }

    function DropZone({ onText, fileName }) {
      const [drag, setDrag] = useState(false);
      const inputRef = useRef(null);

      const readFile = useCallback((file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => onText(String(e.target.result || ''), file.name);
        reader.readAsText(file);
      }, [onText]);

      const onDrop = (e) => {
        e.preventDefault(); setDrag(false);
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        readFile(file);
      };

      return (
        <div
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={onDrop}
          onClick={() => inputRef.current && inputRef.current.click()}
          className={"group relative cursor-pointer rounded-3xl border-2 border-dashed p-10 text-center transition-all duration-200 " +
            (drag
              ? 'border-em-500 bg-em-500/[0.06] shadow-glow'
              : 'border-ink-700 bg-ink-900/40 hover:border-ink-600 hover:bg-ink-850/60')}
        >
          <input ref={inputRef} type="file" accept=".txt,.csv,.tsv,.md,.log,.json,text/*" className="hidden"
            onChange={e => readFile(e.target.files[0])} />
          <div className={"mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl transition " +
            (drag ? 'bg-em-500/20 text-em-400' : 'bg-ink-800 text-zinc-500 group-hover:text-em-400')}>
            <Icon name="upload-cloud" size={26} />
          </div>
          <p className="text-base font-semibold text-zinc-200">
            {fileName ? <span className="text-em-400">{fileName}</span> : 'Drop a file or click to browse'}
          </p>
          <p className="mt-1 text-sm text-zinc-500">Supports .txt, .csv, .tsv, .log, .md & raw text documents</p>
        </div>
      );
    }

    function DataGrid({ rows, columns, onEdit, onAddRow, onDeleteRow }) {
      return (
        <div className="overflow-hidden rounded-2xl border border-ink-700 bg-ink-900/60">
          <div className="max-h-[460px] overflow-auto">
            <table className="w-full border-collapse text-sm">
              <thead className="sticky top-0 z-10">
                <tr className="bg-ink-800">
                  <th className="w-10 border-b border-ink-700 px-2 py-2.5 text-center text-xs font-medium text-zinc-600">#</th>
                  {columns.map(col => (
                    <th key={col} className="border-b border-l border-ink-700 px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-em-400/90 whitespace-nowrap">
                      {col}
                    </th>
                  ))}
                  <th className="w-10 border-b border-l border-ink-700"></th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row, ri) => (
                  <tr key={ri} className="group transition hover:bg-ink-850/70">
                    <td className="border-b border-ink-800 px-2 py-0 text-center text-xs text-zinc-600">{ri + 1}</td>
                    {columns.map(col => (
                      <td key={col} className="grid-cell border-b border-l border-ink-800 align-top">
                        <div
                          contentEditable
                          suppressContentEditableWarning
                          spellCheck={false}
                          onBlur={e => onEdit(ri, col, e.currentTarget.textContent)}
                          className="min-h-[2.4rem] px-3 py-2 text-zinc-300 outline-none"
                        >{row[col]}</div>
                      </td>
                    ))}
                    <td className="border-b border-l border-ink-800 text-center">
                      <button onClick={() => onDeleteRow(ri)}
                        className="text-zinc-700 opacity-0 transition hover:text-rose-400 group-hover:opacity-100">
                        <Icon name="trash-2" size={15} />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex items-center justify-between border-t border-ink-700 bg-ink-850/60 px-3 py-2">
            <button onClick={onAddRow}
              className="flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-zinc-400 transition hover:bg-ink-800 hover:text-em-400">
              <Icon name="plus" size={14} /> Add row
            </button>
            <span className="text-xs text-zinc-600">{rows.length} rows · {columns.length} columns · cells are editable</span>
          </div>
        </div>
      );
    }

    /* ===================================================================== */
    /*  APP                                                                   */
    /* ===================================================================== */
    function App() {
      const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(STORAGE_KEY) || ''; } catch { return ''; } });
      const [rawText, setRawText] = useState('');
      const [fileName, setFileName] = useState('');
      const [rows, setRows] = useState([]);
      const [columns, setColumns] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const provider = providerOf(apiKey);
      const demo = !apiKey;

      const saveKey = useCallback((k) => {
        setApiKey(k);
        try { k ? localStorage.setItem(STORAGE_KEY, k) : localStorage.removeItem(STORAGE_KEY); } catch {}
      }, []);

      const handleText = useCallback((text, name) => {
        setRawText(text);
        setFileName(name || '');
        setError('');
      }, []);

      const unfuck = useCallback(async () => {
        if (!rawText.trim()) { setError('Add some data first — drop a file or paste text below.'); return; }
        setError(''); setLoading(true);
        try {
          let result;
          if (demo) {
            await new Promise(r => setTimeout(r, 2000));
            result = smartParse(rawText);
          } else if (provider === 'claude') {
            result = await callClaude(apiKey, rawText);
          } else {
            result = await callOpenAI(apiKey, rawText);
          }
          if (!result || !result.length) { setError('No tabular structure could be detected in that input.'); setRows([]); setColumns([]); }
          else {
            const norm = normalizeColumns(result);
            setRows(norm);
            setColumns(Object.keys(norm[0]));
          }
        } catch (e) {
          setError(e.message || 'Something went wrong while processing.');
        } finally {
          setLoading(false);
        }
      }, [rawText, demo, provider, apiKey]);

      const editCell = useCallback((ri, col, val) => {
        setRows(rs => rs.map((r, i) => i === ri ? { ...r, [col]: val } : r));
      }, []);
      const addRow = useCallback(() => {
        setRows(rs => [...rs, Object.fromEntries(columns.map(c => [c, '']))]);
      }, [columns]);
      const deleteRow = useCallback((ri) => {
        setRows(rs => rs.filter((_, i) => i !== ri));
      }, []);

      const charCount = rawText.length;

      return (
        <div className="bg-mesh min-h-screen text-zinc-200">
          {/* Nav */}
          <header className="sticky top-0 z-20 border-b border-ink-800/80 bg-ink-950/70 backdrop-blur-xl">
            <div className="mx-auto flex max-w-6xl items-center justify-between px-5 py-3.5">
              <div className="flex items-center gap-2.5">
                <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-em-500 to-em-700 text-white shadow-glow">
                  <Icon name="sparkles" size={18} />
                </div>
                <div className="leading-none">
                  <h1 className="text-[15px] font-bold tracking-tight text-white">Data Unfucker</h1>
                  <p className="mt-0.5 text-[11px] text-zinc-500">Messy in. Clean out.</p>
                </div>
              </div>
              <ApiKeyButton apiKey={apiKey} onSave={saveKey} />
            </div>
          </header>

          {/* Demo banner */}
          {demo && (
            <div className="fadein border-b border-amber-500/20 bg-amber-500/[0.07]">
              <div className="mx-auto flex max-w-6xl items-center gap-2.5 px-5 py-2.5 text-sm">
                <Icon name="info" size={16} className="shrink-0 text-amber-400" />
                <p className="text-amber-200/90">
                  <span className="font-semibold">Demo Mode active.</span> Enter your API key for live AI processing.
                </p>
              </div>
            </div>
          )}

          <main className="mx-auto max-w-6xl px-5 py-10">
            {/* Hero */}
            <div className="mb-9 max-w-2xl">
              <h2 className="text-3xl font-extrabold leading-tight tracking-tight text-white sm:text-4xl">
                Turn <span className="text-em-400">messy data</span> into clean tables.
              </h2>
              <p className="mt-3 text-[15px] leading-relaxed text-zinc-400">
                Drop a file or paste raw text from PDFs, receipts, invoices, or logs. The AI infers the
                structure, builds a clean editable grid, and exports it to CSV — all in your browser.
              </p>
            </div>

            {/* Workspace */}
            <div className="grid gap-5 lg:grid-cols-5">
              {/* Input column */}
              <section className="lg:col-span-2 space-y-4">
                <DropZone onText={handleText} fileName={fileName} />

                <div className="rounded-2xl border border-ink-700 bg-ink-900/50">
                  <div className="flex items-center justify-between border-b border-ink-800 px-4 py-2.5">
                    <span className="flex items-center gap-2 text-xs font-medium text-zinc-400">
                      <Icon name="clipboard-paste" size={14} /> Or paste raw text
                    </span>
                    {charCount > 0 && <span className="text-xs text-zinc-600">{charCount.toLocaleString()} chars</span>}
                  </div>
                  <textarea
                    value={rawText}
                    onChange={e => { setRawText(e.target.value); setFileName(''); setError(''); }}
                    placeholder={"Paste anything here…\n\nInvoice #1042\nDate: 2026-06-01\nClient: Acme Co\nAmount: $1,250.00"}
                    className="h-48 w-full resize-y bg-transparent px-4 py-3 font-mono text-[13px] leading-relaxed text-zinc-300 placeholder-zinc-700 outline-none"
                  />
                </div>

                <button
                  onClick={unfuck}
                  disabled={loading}
                  className="group flex w-full items-center justify-center gap-2.5 rounded-2xl bg-gradient-to-br from-em-500 to-em-600 px-5 py-4 text-base font-bold text-white shadow-glow transition hover:from-em-400 hover:to-em-500 disabled:cursor-not-allowed disabled:opacity-60"
                >
                  <Icon name="wand-sparkles" size={20} className="transition group-hover:rotate-12" />
                  {loading ? 'Working…' : 'Unfuck Data'}
                </button>

                {error && (
                  <div className="fadein flex items-start gap-2 rounded-xl border border-rose-500/30 bg-rose-500/[0.08] px-3.5 py-3 text-sm text-rose-300">
                    <Icon name="triangle-alert" size={16} className="mt-0.5 shrink-0" />
                    <span>{error}</span>
                  </div>
                )}
              </section>

              {/* Output column */}
              <section className="lg:col-span-3">
                <div className="flex h-full min-h-[300px] flex-col rounded-2xl border border-ink-700 bg-ink-900/30 p-4">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="flex items-center gap-2 text-sm font-semibold text-zinc-300">
                      <Icon name="table-2" size={16} className="text-em-400" /> Clean Preview
                    </h3>
                    {rows.length > 0 && (
                      <button onClick={() => downloadCsv(rows, columns)}
                        className="flex items-center gap-2 rounded-lg border border-em-600/40 bg-em-600/10 px-3.5 py-2 text-sm font-semibold text-em-300 transition hover:bg-em-600/20">
                        <Icon name="download" size={15} /> Export to CSV
                      </button>
                    )}
                  </div>

                  {loading ? (
                    <LoadingState demo={demo} />
                  ) : rows.length > 0 ? (
                    <div className="fadein">
                      <DataGrid rows={rows} columns={columns} onEdit={editCell} onAddRow={addRow} onDeleteRow={deleteRow} />
                    </div>
                  ) : (
                    <div className="flex flex-1 flex-col items-center justify-center gap-3 py-12 text-center">
                      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-ink-850 text-zinc-700">
                        <Icon name="table-properties" size={26} />
                      </div>
                      <p className="text-sm text-zinc-500">Your clean table will appear here.</p>
                      <p className="max-w-xs text-xs text-zinc-700">
                        Columns are detected automatically from your data — no fixed schema.
                      </p>
                    </div>
                  )}
                </div>
              </section>
            </div>

            {/* Feature strip */}
            <div className="mt-12 grid gap-4 sm:grid-cols-3">
              {[
                { icon: 'lock', t: 'Private by default', d: 'Files are read locally with the browser FileReader. Your key lives in localStorage.' },
                { icon: 'columns-3', t: 'Dynamic columns', d: 'Headers come straight from your data’s context — never hardcoded.' },
                { icon: 'pencil', t: 'Editable & exportable', d: 'Fix any AI slip inline, then export a clean .csv in one click.' },
              ].map(f => (
                <div key={f.t} className="rounded-2xl border border-ink-800 bg-ink-900/40 p-5">
                  <div className="mb-3 flex h-10 w-10 items-center justify-center rounded-xl bg-em-500/10 text-em-400">
                    <Icon name={f.icon} size={18} />
                  </div>
                  <h4 className="text-sm font-semibold text-zinc-200">{f.t}</h4>
                  <p className="mt-1 text-[13px] leading-relaxed text-zinc-500">{f.d}</p>
                </div>
              ))}
            </div>
          </main>

          <footer className="border-t border-ink-800/70 py-6">
            <div className="mx-auto max-w-6xl px-5 text-center text-xs text-zinc-600">
              Data Unfucker · client-side AI data cleaning ·
              {provider ? <span className="text-zinc-500"> connected to {provider === 'claude' ? 'Claude' : 'OpenAI'}</span> : <span> running in demo mode</span>}
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
